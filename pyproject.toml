[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-citation-finder"
version = "0.4.1"
description = "Discover academic papers that cite a given dataset across multiple scholarly databases."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["dataset_citation_finder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
