[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-citation-finder"
version = "0.1.0"
description = "Discover academic papers that cite a given dataset across multiple scholarly databases."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pandas>=2.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
bibtex = ["bibtexparser>=1.4"]
progress = ["tqdm>=4.65"]
gscholar = ["scholarly>=1.7"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["dataset_citation_finder*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
